<script type="application/json" id="ff-content">{"meta":{"title":"Forest Futures","subtitle":"A strategic foresight game for forest leaders","edition":"2026.11","updated":"2026-11-14","credits":"Evolved from “IMPACT: a foresight game – forestry edition” (2019) by the Strategic Foresight Group — David N. Bengston and Lynne M. Westphal (USDA Forest Service, Northern Research Station) and Michael J. Dockry and Jason S. Crabtree (University of Minnesota) — itself an adaptation of IMPACT, designed by Idea Couture in collaboration with Policy Horizons Canada.","notice":"Signals are drawn from real-world sources; their effects in the game are speculative and meant to provoke discussion, not to predict. This is an independent tool, not an official product of USDA or any agency."},"domains":[{"id":"fire","name":"Fire & Fuels","short":"Fire","icon":"fire","description":"Wildfire risk and behavior, fuels, prescribed and cultural fire, suppression capacity, smoke.","examples":"Fuels treatments, fire seasons, burn windows, suppression costs","color":"#C2461E"},{"id":"health","name":"Forest Health","short":"Health","icon":"health","description":"Biodiversity, insects and disease, invasive species, drought stress, reforestation and adaptation.","examples":"Bark beetles, seed supply, mortality, restoration","color":"#5E7D2E"},{"id":"water","name":"Water & Watersheds","short":"Water","icon":"water","description":"Source water, snowpack, streams, floods, post-fire watersheds and aquatic habitat.","examples":"Municipal supply, snow drought, debris flows, dam removal","color":"#2B6CA3"},{"id":"climate","name":"Climate & Carbon","short":"Carbon","icon":"climate","description":"Forest carbon storage, carbon markets, emissions, bioenergy and climate policy.","examples":"Offsets, sequestration, biochar, climate targets","color":"#2E7F7A"},{"id":"wood","name":"Wood Economy","short":"Wood","icon":"wood","description":"Timber, mills, mass timber, biomass, non-timber forest products and trade.","examples":"Mill capacity, lumber prices, tariffs, new wood materials","color":"#94643A"},{"id":"communities","name":"Communities & the WUI","short":"Communities","icon":"communities","description":"Rural economies, growth in the wildland–urban interface, housing, insurance, equity and community health.","examples":"Home hardening, insurance retreat, rural jobs, smoke exposure","color":"#A2504F"},{"id":"recreation","name":"Recreation & Public Connection","short":"Recreation","icon":"recreation","description":"Outdoor recreation, access, visitation, wellness and public trust in land managers.","examples":"Visitor services, trail backlog, fees, nature and health","color":"#3B8DBF"},{"id":"workforce","name":"Workforce & Capacity","short":"Workforce","icon":"workforce","description":"Agency and partner workforce, fire crews, contractors, skills, and science, data and technology capacity.","examples":"Staffing, hiring, retention, training, research capacity, AI tools","color":"#B98A1E"},{"id":"governance","name":"Policy & Funding","short":"Policy","icon":"governance","description":"Budgets, authorities, legislation, litigation, agency structure and federal–state roles.","examples":"Appropriations, reorganization, NEPA, executive actions","color":"#6B4C83"},{"id":"partners","name":"Partnerships & Co-Stewardship","short":"Partners","icon":"partners","description":"Tribal co-stewardship, shared stewardship with states, Good Neighbor agreements, NGOs, and private and family forest owners.","examples":"Co-management agreements, cross-boundary projects, landowner programs","color":"#6F9468"}],"bands":[{"min":0,"max":2,"label":"Crisis"},{"min":3,"max":4,"label":"Strained"},{"min":5,"max":6,"label":"Stable"},{"min":7,"max":8,"label":"Thriving"},{"min":9,"max":10,"label":"Transformed"}],"eras":[{"id":"now","name":"Now","years":"2026–2030","description":"Trends already in motion and decisions already made. High certainty, little time.","weights":{"now":0.7,"near":0.25,"far":0.05}},{"id":"near","name":"Near","years":"2031–2038","description":"Emerging changes that are plausible within a planning cycle or two.","weights":{"now":0.25,"near":0.55,"far":0.2}},{"id":"far","name":"Far","years":"2039–2050","description":"Weak signals and wildcards. Low certainty, high consequence.","weights":{"now":0.05,"near":0.35,"far":0.6}}],"signals":[{"id":"sig-ten-am-rule-returns","title":"The 10 a.m. rule, take two","signal":"Interior ordered the new U.S. Wildland Fire Service to fully suppress every wildfire it manages, echoing the 1935 '10 a.m. rule'; the Forest Service also operates under a full-suppression policy.","horizon":"now","primary":{"domain":"fire","delta":-1,"text":"More starts are caught small, but fewer fires burn for benefit; fuels keep building and future fires get harder to stop."},"secondary":{"type":"fixed","domain":"communities","delta":1,"text":"In the short run, fewer fires reach towns and managed-fire smoke days drop, even as fuels build."},"prompt":"When is putting every fire out the riskiest choice, and who should decide?","source":{"title":"As wildfires worsen, Trump administration revives discredited policy to stomp out all fires quickly","publisher":"Associated Press (via KTAR News)","date":"2026-06-30","url":"https://ktar.com/national-news/as-wildfires-worsen-trump-administration-revives-discredited-policy-to-stomp-out-all-fires-quickly/5884780/"},"tags":["federal","suppression","USWFS","fire policy"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-fuels-work-drops-a-third","title":"Fuels work drops a third","signal":"An outside analysis found Forest Service fuel-treatment acres fell from over 4 million in 2024 to about 2.6 million in 2025, and prescribed burning roughly halved; the agency cites fire demands and hurricane debris, critics cite staff losses.","horizon":"now","primary":{"domain":"fire","delta":-2,"text":"Untreated acres pile up just as hot, dry seasons return; the odds of severe, fast-moving fire climb."},"secondary":{"type":"remove","amount":1,"text":"Remove 1 point from a domain hurt most by the treatment backlog, and explain how the harm unfolds."},"prompt":"How do we rebuild treatment pace when the same people are pulled to fight fires?","source":{"title":"Trump administration falls behind on wildfire prevention with risky fire season ahead","publisher":"NPR (via KPBS)","date":"2026-05-04","url":"https://www.kpbs.org/news/2026/05/04/trump-administration-falls-behind-on-wildfire-prevention-with-risky-fire-season-ahead"},"tags":["federal","fuels","prescribed fire","workforce"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-clearing-air-for-good-fire","title":"Clearing the air for good fire","signal":"The Senate unanimously passed a bill easing Clean Air Act penalties on states for prescribed burns and creating grants to protect schools and community buildings from smoke; it must be reconciled with a broader House bill.","horizon":"now","primary":{"domain":"fire","delta":1,"text":"States schedule more prescribed burns without fear of air-quality violations, and scarce burn windows actually get used."},"secondary":{"type":"fixed","domain":"communities","delta":1,"text":"Smoke-ready schools and shelters give residents cleaner air on the worst days."},"prompt":"How do we share smoke trade-offs with communities before the burn, not after?","source":{"title":"Wildfire bill to ease path for controlled burns passes Senate","publisher":"Roll Call","date":"2026-09-29","url":"https://rollcall.com/2026/09/29/wildfire-bill-to-ease-path-for-controlled-burns-passes-senate/"},"tags":["legislation","prescribed fire","smoke","Clean Air Act"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-burn-boss-backstop","title":"A backstop for the burn boss","signal":"Texas A&M Forest Service launched a temporary, state-run self-insurance pool for certified prescribed burn managers, after commercial coverage for them grew scarce or vanished statewide.","horizon":"near","primary":{"domain":"fire","delta":1,"text":"Public liability pools spread across states, and private burners put good fire back on millions of acres."},"secondary":{"type":"fixed","domain":"governance","delta":-1,"text":"The state now carries the claims risk, so one escaped burn could land on taxpayers and lawmakers."},"prompt":"Who should carry the risk when good fire goes bad?","source":{"title":"Texas A&M Forest Service Launches Prescribed Burn Manager Insurance Program","publisher":"Insurance Journal","date":"2026-09-02","url":"https://www.insurancejournal.com/news/southcentral/2026/09/02/883715.htm"},"tags":["state","prescribed fire","insurance","liability","private land"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-smoke-alarms-in-orbit","title":"Smoke alarms in orbit","signal":"The first three operational FireSat satellites reached orbit in 2026, able to spot fires about 5 meters across through smoke and cloud; backers aim for hourly global revisits by 2029.","horizon":"near","primary":{"domain":"fire","delta":1,"text":"Near-constant detection catches starts early; initial attack wins more often and fewer fires escape."},"secondary":{"type":"add","amount":1,"text":"Add 1 point to a domain that gains from near-real-time fire data, and explain how."},"prompt":"If every start is seen within an hour, what changes in how we staff and decide?","source":{"title":"Muon Space Deploys First Three Operational FireSat Satellites for Earth Fire Alliance","publisher":"Muon Space","date":"2026-07-07","url":"https://www.muonspace.com/muon-space-deploys-first-three-operational-firesat-satellites-for-earth-fire-alliance/"},"tags":["technology","remote sensing","detection","philanthropy"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-prairie-fire-xl","title":"Prairie fire, extra large","signal":"Nebraska's Morrill Fire burned about 642,000 acres in March 2026, the largest in state history; on some rural starts, NOAA's experimental AI satellite detections arrived before firefighters were dispatched.","horizon":"near","primary":{"domain":"fire","delta":-1,"text":"Megafires spread beyond the West; plains and eastern states face huge fires with thin crews and few plans."},"secondary":{"type":"remove","amount":1,"text":"Remove 1 point from a domain a plains megafire would hit hardest, and explain."},"prompt":"Is our mutual-aid system ready for megafires where we rarely expect them?","source":{"title":"NOAA's Wildfire Detection System a “Game Changer” for Nebraska's Record-Breaking Morrill Fire","publisher":"NOAA NESDIS","date":"2026-04-09","url":"https://www.nesdis.noaa.gov/news/noaas-wildfire-detection-system-game-changer-nebraskas-record-breaking-morrill-fire"},"tags":["grassland","Great Plains","detection","AI","megafire"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-smoke-gets-in-our-lungs","title":"Smoke gets in our lungs","signal":"A 2025 Nature study estimates wildfire smoke already contributes to about 40,000 U.S. deaths a year and could exceed 71,000 annually by 2050 under high emissions.","horizon":"far","primary":{"domain":"fire","delta":-2,"text":"Smoke, not flame, becomes wildfire's largest toll, pressing agencies to manage fire for air quality as well as acres."},"secondary":{"type":"fixed","domain":"governance","delta":1,"text":"Mounting health costs give fire and air agencies a shared case for prescribed-fire and smoke-readiness funding."},"prompt":"Should smoke health outcomes become a core measure of fire program success?","source":{"title":"Wildfire smoke could soon kill 71,000 Americans every year","publisher":"Grist (via Popular Science)","date":"2025-09-19","url":"https://www.popsci.com/health/wildfire-smoke-could-soon-kill-71000-americans-every-year"},"tags":["smoke","public health","climate","research"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-boreal-fire-math","title":"Alaska's fire math doubles","signal":"A 2026 study projects area burned in Alaska rising under every emissions scenario, more than doubling under high emissions, with up to eightfold increases in parts of Alaska's Arctic and west.","horizon":"far","primary":{"domain":"fire","delta":-1,"text":"Northern megafires lengthen the national season and pull crews and aircraft north when the West needs them."},"secondary":{"type":"fixed","domain":"climate","delta":-1,"text":"Burning boreal forest and peat release vast stores of carbon, accelerating warming."},"prompt":"How do we share scarce crews when the fire season never ends somewhere?","source":{"title":"Study Outlines a Range of Possible Fire Futures for Alaska","publisher":"U.S. Geological Survey","date":"2026-09-29","url":"https://www.usgs.gov/programs/climate-adaptation-science-centers/news/study-outlines-a-range-possible-fire-futures"},"tags":["Alaska","boreal","climate","research","carbon"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-fires-that-never-grow-up","title":"Fires that never grow up","signal":"In XPRIZE Wildfire finals in Alaska, teams had to autonomously find and extinguish fires within 10 minutes of ignition across about 1,000 square kilometers; award winner Dryad plans pilots in 2027.","horizon":"far","primary":{"domain":"fire","delta":2,"text":"Sensor-and-drone networks snuff most starts within minutes; escaped fires become rare near communities and critical watersheds."},"secondary":{"type":"move","amount":1,"text":"Move 1 point between domains to show who gains and who loses when robots fight fire. Explain."},"prompt":"If machines catch every start, how do we keep beneficial fire on the land?","source":{"title":"Dryad Networks Wins XPRIZE Wildfire Award for Drones, Sensor Networks","publisher":"DroneLife","date":"2026-10-02","url":"https://dronelife.com/2026/10/02/dryad-networks-wins-xprize-wildfire-award-for-drones-sensor-networks/"},"tags":["technology","drones","autonomy","suppression","XPRIZE"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-one-nepa-rulebook","title":"One rulebook, fewer comment periods","signal":"USDA's department-wide NEPA procedures took effect in April 2026, centralizing categorical exclusions and leaving public comment on most environmental assessments and exclusions to the responsible official's discretion.","horizon":"now","primary":{"domain":"governance","delta":1,"text":"Projects clear review faster and small teams move more work, though thinner records raise litigation risk."},"secondary":{"type":"fixed","domain":"recreation","delta":-1,"text":"Some publics feel shut out of decisions; trust erodes where comment was once routine."},"prompt":"How do we keep people engaged when the law no longer requires it?","source":{"title":"US Department of Agriculture Finalizes Updated NEPA Procedures","publisher":"WilmerHale","date":"2026-04-27","url":"https://www.wilmerhale.com/en/insights/client-alerts/20260427-us-department-of-agriculture-finalizes-updated-nepa-procedures"},"tags":["federal","NEPA","regulation","public engagement"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-appropriators-hold-line","title":"Appropriators hold the line, for now","signal":"The FY2027 request would cut the Forest Service line about 75%, largely by moving firefighting to Interior; House appropriators kept fire in the agency and raised its total about 2%. A stopgap runs through December 11.","horizon":"now","primary":{"domain":"governance","delta":1,"text":"Bipartisan appropriators keep core programs funded, buying time, though stopgaps and shutdown threats still freeze planning."},"secondary":{"type":"protect","text":"Protect one domain: name the line item appropriators shield this era and why it survives."},"prompt":"What would we cut first if a shutdown hit during fire season?","source":{"title":"Interior, Environment, and Related Agencies: Overview of FY2027 Appropriations (R49292)","publisher":"Congressional Research Service (via EveryCRSReport)","date":"2026-10-21","url":"https://www.everycrsreport.com/files/2026-10-21_R49292_bfd3ba78b460c7241162661110ab1cc6e1fd19bc.html"},"tags":["federal","budget","appropriations","shutdown"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-fire-borrowing-comeback","title":"Fire borrowing's comeback tour","signal":"The 2018 wildfire funding fix, a disaster cap adjustment worth about $2.9 billion for the Forest Service and Interior in FY2026, expires after 2027, and Congress has not agreed how to extend it, reviving the risk of raiding non-fire accounts.","horizon":"now","primary":{"domain":"governance","delta":-1,"text":"Without an extension, big fire years again drain restoration, recreation and research budgets mid-season."},"secondary":{"type":"remove","amount":1,"text":"Remove 1 point from the domain whose budget gets borrowed first, and explain the trade."},"prompt":"Which partner commitments would we break if fire borrowing returned next summer?","source":{"title":"Forest Service nears a return to 'fire borrowing' unless Congress acts","publisher":"E&E News (POLITICO)","date":"2026-01-28","url":"https://www.eenews.net/articles/forest-service-nears-a-return-to-fire-borrowing-unless-congress-acts"},"tags":["federal","budget","suppression funding","Congress"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-roadless-rule-hits-road","title":"The roadless rule hits the road","signal":"USDA proposed rescinding the 2001 Roadless Rule across 44.7 million acres, about 30 percent of national forest land, keeping Idaho and Colorado's state rules; comments closed in October and lawsuits are expected once final.","horizon":"now","primary":{"domain":"governance","delta":-1,"text":"Years of litigation and shifting rules cloud planning in roadless areas, whichever way the courts rule."},"secondary":{"type":"move","amount":1,"text":"Move 1 point between domains, say recreation to wood or the reverse, and explain who gains access and who loses."},"prompt":"Where would new roads reduce fire risk, and where would they add to it?","source":{"title":"Trump Administration Proposes to Rescind Roadless Rule","publisher":"Harvard Law School Environmental & Energy Law Program","date":"2026-09-14","url":"https://eelp.law.harvard.edu/trump-administration-proposes-to-rescind-roadless-rule/"},"tags":["federal","regulation","roadless","litigation","timber"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-one-fire-flag","title":"One flag for wildland fire","signal":"Interior launched the U.S. Wildland Fire Service in January 2026, merging its bureaus' fire programs; Congress declined to fund folding in Forest Service firefighters and ordered a feasibility study first.","horizon":"near","primary":{"domain":"governance","delta":1,"text":"A single federal fire agency, authorized with clear ties to land managers, simplifies command, budgets and accountability."},"secondary":{"type":"fixed","domain":"workforce","delta":-1,"text":"Years of transition churn, from new chains of command to new duty stations, push some veterans out."},"prompt":"What must stay connected between fire and land management if fire gets its own agency?","source":{"title":"Trump administration stands up consolidated federal firefighting agency over bipartisan congressional reservations","publisher":"Government Executive","date":"2026-01-13","url":"https://www.govexec.com/management/2026/01/trump-administration-stands-consolidated-federal-firefighting-agency-over-bipartisan-congressional-reservations/410661"},"tags":["federal","USWFS","agency structure","Interior","Congress"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-fix-our-forests-parked","title":"Fix Our Forests, still parked","signal":"The Fix Our Forests Act passed the House 279-141 in January 2025 and cleared Senate Agriculture 18-5, but still awaits a floor vote; backers want it attached to the defense authorization bill.","horizon":"near","primary":{"domain":"governance","delta":1,"text":"A version becomes law: faster reviews, a federal wildfire intelligence center and a new community wildfire risk-reduction program."},"secondary":{"type":"add","amount":1,"text":"Add 1 point to a domain that gains when fireshed projects move faster, and explain how."},"prompt":"Which stalled projects would move first, and are we staffed to deliver them?","source":{"title":"Wildfire bill stalls in Senate as insurance market keeps shrinking","publisher":"Insurance Business","date":"2026-08-10","url":"https://www.insurancebusinessmag.com/us/news/catastrophe/wildfire-bill-stalls-in-senate-as-insurance-market-keeps-shrinking-585530.aspx"},"tags":["legislation","Congress","fuels","insurance"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-utility-fire-shield","title":"Utilities seek a fire shield","signal":"About half of Western states have enacted some limit on utility wildfire liability, usually tied to approved mitigation plans; insurers warn the costs shift to homeowners, and some fire survivors oppose the limits.","horizon":"near","primary":{"domain":"governance","delta":1,"text":"Clear liability rules keep utilities solvent and paying for line hardening, vegetation clearing and smarter shutoffs."},"secondary":{"type":"fixed","domain":"communities","delta":-1,"text":"Survivors recover less after utility-caused fires, and homeowner premiums rise to absorb the gap."},"prompt":"What should a utility owe if it followed its plan and still started a fire?","source":{"title":"Electric companies are fighting across the West to limit their blame for wildfires","publisher":"KJZZ / Mountain West News Bureau (via KUNC)","date":"2025-08-31","url":"https://www.kunc.org/regional-news/2025-08-31/electric-companies-are-fighting-across-the-west-to-limit-their-blame-for-wildfires"},"tags":["state","utilities","liability","insurance"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-for-sale-public-land","title":"'For sale' signs on public land","signal":"A 2025 Senate budget-bill draft would have required selling 600,000 to 1.2 million acres of BLM land within a decade, partly for housing; it was withdrawn amid public backlash and Senate rules problems.","horizon":"far","primary":{"domain":"governance","delta":-2,"text":"Disposal returns in a future budget fight; scattered sales fragment management and access across the West."},"secondary":{"type":"fixed","domain":"communities","delta":1,"text":"Sold parcels could open land for housing near crowded towns, the benefit sale backers point to."},"prompt":"Which parcels near our communities are most at risk, and who would defend them?","source":{"title":"Federal land sale withdrawn from Senate's version of the Big Beautiful Bill","publisher":"Wyoming Public Radio / Mountain West News Bureau (via KUNC)","date":"2025-06-30","url":"https://www.kunc.org/regional-news/2025-06-30/federal-land-sale-withdrawn-from-senates-version-of-the-big-beautiful-bill"},"tags":["federal","public lands","wildcard","housing"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-states-take-the-wheel","title":"States take the wheel","signal":"The Forest Service held 540 Good Neighbor agreements in FY2025, 426 of them with 39 states plus others with counties and Tribes, and partners may keep timber revenue for restoration through FY2028.","horizon":"far","primary":{"domain":"governance","delta":1,"text":"Cross-boundary agreements mature into shared management, with states and Tribes running much of the work on federal land."},"secondary":{"type":"fixed","domain":"workforce","delta":-1,"text":"State, county and Tribal staff stretch thin running work on land they do not own."},"prompt":"What capacity would our state need to run federal projects at scale?","source":{"title":"The Good Neighbor Authority on Federal Lands: In Brief (R49480)","publisher":"Congressional Research Service (via EveryCRSReport)","date":"2026-10-07","url":"https://www.everycrsreport.com/reports/R49480.html"},"tags":["state","Good Neighbor Authority","shared stewardship","Tribal"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-states-first-fema-second","title":"States first, FEMA second","signal":"A Trump-appointed FEMA Review Council recommended raising the damage threshold for federal disaster aid by more than half and paying states lump sums, giving states more control and more of the burden.","horizon":"far","primary":{"domain":"governance","delta":-1,"text":"Federal aid covers only the biggest disasters; states and counties absorb mid-sized fires, floods and recovery costs."},"secondary":{"type":"protect","text":"Protect one domain: name what your state would fund first when federal disaster aid shrinks."},"prompt":"If federal disaster aid shrank tomorrow, what would our state stop doing?","source":{"title":"A Trump council recommends overhauling FEMA. Here are 3 key changes","publisher":"NPR (via Michigan Public)","date":"2026-05-07","url":"https://www.michiganpublic.org/2026-05-07/a-trump-council-recommends-overhauling-fema-here-are-3-key-changes"},"tags":["federal","disaster aid","FEMA","federal-state roles"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-bigger-targets-thinner-ranks","title":"Bigger targets, thinner ranks","signal":"GAO found the Forest Service workforce fell about 20 percent in 2025, with some forests missing 40 percent or more of timber staff, just as an executive order raised harvest targets.","horizon":"now","primary":{"domain":"workforce","delta":-2,"text":"Sale preparation, contracting and planning skills thin out; remaining staff juggle several jobs and burn out."},"secondary":{"type":"fixed","domain":"wood","delta":-1,"text":"Timber sales lag targets, leaving mills short of federal logs."},"prompt":"Which skills would take us longest to rebuild if they walked out the door?","source":{"title":"Forest Service: Opportunities Exist to Improve Timber Sale Management (GAO-26-107993)","publisher":"U.S. Government Accountability Office","date":"2026-06-04","url":"https://files.gao.gov/reports/GAO-26-107993/index.html"},"tags":["federal","workforce","timber","GAO"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-raise-refilled-crews","title":"The raise that refilled the crews","signal":"The Forest Service reported about 11,550 seasonal fire staff trained or ready in June 2026, roughly 200 above its goal, crediting recent firefighter pay raises, even as it lost nearly 6,000 permanent staff.","horizon":"now","primary":{"domain":"workforce","delta":1,"text":"Competitive pay keeps seasonal crews full and steadies recruitment, even as support ranks thin."},"secondary":{"type":"fixed","domain":"governance","delta":-1,"text":"Permanent raises add a recurring cost that squeezes other programs when budgets stay flat."},"prompt":"Pay fixed recruitment; what would fix retention of mid-career leaders?","source":{"title":"As western fires erupt, Trump's Forest Service says it's now fully staffed","publisher":"NPR (via OPB)","date":"2026-06-18","url":"https://www.opb.org/article/2026/06/18/as-western-fires-erupt-trump-s-forest-service-says-it-s-now-fully-staffed/"},"tags":["federal","firefighters","pay","hiring"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-pack-the-lab-or-quit","title":"Pack the lab, or quit","signal":"USDA's plan to move Forest Service headquarters to Salt Lake City, replace regional offices with state offices and close about two dozen research stations was halted by a federal judge in October 2026; the ruling is under appeal.","horizon":"now","primary":{"domain":"workforce","delta":-2,"text":"Scientists and specialists unwilling to relocate leave; decades of local expertise and field relationships walk out."},"secondary":{"type":"fixed","domain":"governance","delta":1,"text":"USDA projects lower overhead; if the savings hold, some dollars could shift toward field work."},"prompt":"How would our partnerships change if the nearest federal scientists moved 1,000 miles away?","source":{"title":"Agriculture secretary says agency is “full-bore ahead” on Forest Service reorganization","publisher":"Associated Press (via KTAR News)","date":"2026-10-22","url":"https://ktar.com/national-news/agriculture-secretary-says-agency-is-full-bore-ahead-on-forest-service-reorganization"},"tags":["federal","reorganization","research","relocation","litigation"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-thin-bench-fireline","title":"Thin bench on the fireline","signal":"Federal officials warned of a 15 percent drop in available hotshot crews in 2026, and only 38 teams could handle the largest, fastest fires, down from 44 two years earlier.","horizon":"near","primary":{"domain":"workforce","delta":-1,"text":"Leadership gaps compound; too few crew bosses and incident commanders for longer, overlapping fire seasons."},"secondary":{"type":"remove","amount":1,"text":"Remove 1 point from a domain that suffers when experienced fire leaders are scarce, and explain."},"prompt":"Who are our next incident commanders, and what are we doing to keep them?","source":{"title":"Federal Job Cuts Are Making Wildfires Harder to Fight","publisher":"The New York Times (via GV Wire)","date":"2026-08-14","url":"https://gvwire.com/2026/08/14/federal-job-cuts-are-making-wildfires-harder-to-fight/"},"tags":["federal","firefighters","leadership","incident management"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-forestry-farm-team","title":"Forestry's new farm team","signal":"A Western forestry association launched a four-state initiative linking students, schools and employers, with about $450,000 in early industry pledges, citing a trend of two trades entrants for every five retirees.","horizon":"near","primary":{"domain":"workforce","delta":1,"text":"Regional career pathways stea ill now","publisher":"E&E News by POLITICO","date":"2026-07-21","url":"https://www.eenews.net/articles/businesses-urge-congress-to-pass-outdoors-bill-now/"},"tags":["infrastructure","deferred-maintenance","legislation","federal"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-rangers-still-poll-well","title":"Rangers still poll well","signal":"In an August 2025 Pew survey, 76% of Americans viewed the National Park Service favorably, with nearly identical ratings from Republicans (78%) and Democrats (79%), a rare bipartisan bright spot.","horizon":"near","primary":{"domain":"recreation","delta":1,"text":"Public-land stewards keep cross-party goodwill that can anchor outreach, volunteering and support."},"secondary":{"type":"fixed","domain":"governance","delta":1,"text":"Shared regard gives lawmakers common ground on public-land funding."},"prompt":"Does the Forest Service enjoy the same goodwill, and how would we know?","source":{"title":"Republicans' views of Justice Department, FBI rebound as Democrats' views shift more negative","publisher":"Pew Research Center","date":"2025-08-27","url":"https://www.pewresearch.org/politics/2025/08/27/republicans-views-of-justice-department-fbi-rebound-as-democrats-views-shift-more-negative/"},"tags":["public-trust","polling","public-lands","bipartisan"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-sharing-the-sacred-summit","title":"Sharing the sacred summit","signal":"A 2026 agreement makes the Black Elk Wilderness, around South Dakota's highest peak, a co-stewardship site with Great Sioux Nation Tribes, covering recreation, cultural protection, habitat and Tribal hiring.","horizon":"near","primary":{"domain":"recreation","delta":1,"text":"Visitors learn from Tribal interpreters and stewards at a sacred place, deepening understanding and respect."},"secondary":{"type":"fixed","domain":"workforce","delta":1,"text":"Tribal hiring brings new rangers and interpreters with deep knowledge of the place."},"prompt":"Where do visitor experiences on our lands need Tribal voices to tell the story?","source":{"title":"Caring for the heart of everything that is","publisher":"USDA Forest Service","date":"2026-06-16","url":"https://www.fs.usda.gov/about-agency/features/caring-heart-everything"},"tags":["tribal","co-stewardship","wilderness","interpretation"],"status":"active","reviewed":"2026-11-14","origin":"new"},{"id":"sig-silver-trail-boom","title":"The silver trail boom","signal":"A record 183.2 million Americans recreated outdoors in 2025, but less often; participation among those 65 and older climbed from 25.7% in 2016 to 41.6%, adding 12 million older participants in a decade.","horizon":"far","primary":{"domain":"recreation","delta":1,"text":"An older, broader visitor base strengthens public connection and political support for public lands."},"secondary":{"type":"add","text":"Add 1 to another domain that gains from older visitors and volunteers. Explain how.","amount":1},"prompt":"Are our trails, facilities and safety messages designed for visitors in their seventies?","source":{"title":"Outdoor Recreation Participation Hits Record 183.2 Million Americans in 2025, OIA Report Finds","publisher":"Modern Campground","date":"2026-06-22","url":"https://moderncampground.com/usa/outdoor-recreation-participation-hits-record-183-2-million-americans-in-2025-oia-report-finds/"},"tags":["participation","aging","demographics","accessibility"],"status":"active","reviewed":"2026-11-14","origin":"new"}],"drivers":[{"id":"drv-one-fire-service","title":"Fire gets its own agency","text":"Interior launched the U.S. Wildland Fire Service in early 2026, merging its bureaus' fire programs. Budgets propose folding Forest Service fire in too, but Congress has funded the two separately and wants a feasibility study first.","horizon":"now","effects":[{"domain":"workforce","delta":-1},{"domain":"partners","delta":-1}],"dilemma":{"prompt":"Congress asks for your view: should Forest Service wildland fire move into Interior's new fire service?","options":[{"label":"Back one fire service","text":"Support a full merger: one command, one budget, and firefighters led by firefighters across federal lands.","effects":[{"domain":"fire","delta":1},{"domain":"health","delta":-1}]},{"label":"Keep fire with forests","text":"Keep fire inside the Forest Service so fuels, timber and fire planning stay integrated on the same ground.","effects":[{"domain":"health","delta":1},{"domain":"governance","delta":-1}]},{"label":"Joint command, no merger","text":"Create a shared USDA–Interior fire command with pooled dispatch and aviation, but keep separate agencies and budgets.","effects":[{"domain":"fire","delta":1},{"domain":"workforce","delta":-1}]}]},"source":{"title":"As potentially significant season kicks off, the US Wildland Fire Service's first chief shares priorities","publisher":"OPB","date":"2026-05-02","url":"https://www.opb.org/article/2026/05/02/us-wildland-fire-service-first-chief/"},"tags":["federal","fire","structure","interior"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-regions-to-states","title":"Goodbye regions, hello governors","text":"USDA plans to close all nine Forest Service regional offices, move headquarters to Salt Lake City and create 15 state directors to work with governors. A federal judge paused the plan in October, a ruling now under appeal.","horizon":"now","effects":[{"domain":"workforce","delta":-2},{"domain":"partners","delta":1},{"domain":"governance","delta":-1}],"dilemma":{"prompt":"Your new state director asks how closely federal forest priorities should track the governor's agenda.","options":[{"label":"One shared state plan","text":"Write a joint state–federal forest plan with the governor's office, pooling staff, budgets and priorities.","effects":[{"domain":"partners","delta":1},{"domain":"governance","delta":-1}]},{"label":"National rules first","text":"Coordinate closely, but keep national standards and federal law as the anchor for every decision.","effects":[{"domain":"governance","delta":1},{"domain":"partners","delta":-1}]},{"label":"Delegate via Good Neighbor","text":"Shift more project work to state crews through Good Neighbor agreements, including timber sale preparation.","effects":[{"domain":"workforce","delta":1},{"domain":"health","delta":-1}]}]},"source":{"title":"Forest Service to move HQ out of DC, shutter regional offices in sweeping overhaul","publisher":"Government Executive","date":"2026-04-01","url":"https://www.govexec.com/management/2026/04/forest-service-move-hq-out-dc-shutter-regional-offices-sweeping-overhaul/412566/"},"tags":["federal","structure","states","reorganization"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-lean-years","title":"The incredible shrinking budget","text":"After losing thousands of staff in 2025, the Forest Service faces a 2027 budget request that cuts National Forest System funds about 24% and zeroes out its research and State, Private and Tribal Forestry lines.","horizon":"now","effects":[{"domain":"governance","delta":-2},{"domain":"workforce","delta":-1}],"dilemma":{"prompt":"Money is down again. As a leadership team, what do you protect first?","options":[{"label":"Fire readiness first","text":"Protect crews, engines and aviation; defer trail work, research and partner grants.","effects":[{"domain":"fire","delta":1},{"domain":"communities","delta":1},{"domain":"recreation","delta":-2}]},{"label":"Keep partners whole","text":"Protect state, Tribal and nonprofit agreements that bring outside money, even if federal crews shrink.","effects":[{"domain":"partners","delta":1},{"domain":"fire","delta":-1}]},{"label":"Fees up, sites down","text":"Raise recreation fees and close low-use sites to keep a funded core workforce.","effects":[{"domain":"workforce","delta":1},{"domain":"governance","delta":1},{"domain":"recreation","delta":-2}]}]},"source":{"title":"Chief Tom Schultz details, defends largest Forest Service reorganization in a century","publisher":"Daily Montanan","date":"2026-07-06","url":"https://dailymontanan.com/2026/07/06/chief-tom-schultz-details-defends-largest-forest-service-reorganization-in-a-century/"},"tags":["federal","budget","workforce"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-record-fire-year","title":"A decade-high fire year","text":"By September 5, 2026, more than 8.3 million acres had burned nationwide, the most for that date in a decade, with Oregon and Washington hit hardest. Nearly 18,000 personnel were on the lines.","horizon":"now","effects":[{"domain":"fire","delta":-1},{"domain":"communities","delta":-1},{"domain":"workforce","delta":-1}],"dilemma":{"prompt":"After a record fire year, do you keep a full-suppression posture or reopen room for prescribed and managed fire?","options":[{"label":"Suppress every start","text":"Put out every fire fast to protect homes, crews and air quality; defer burning.","effects":[{"domain":"communities","delta":1},{"domain":"fire","delta":-1}]},{"label":"Reopen the burn window","text":"Expand prescribed and managed fire with states and Tribes, accepting smoke and escape risk.","effects":[{"domain":"fire","delta":2},{"domain":"communities","delta":-1},{"domain":"recreation","delta":-1}]},{"label":"Thin, don't burn","text":"Lean on mechanical thinning and fuel breaks near towns, with little burning.","effects":[{"domain":"fire","delta":1},{"domain":"health","delta":-1}]}]},"source":{"title":"US Wildfire Acreage Hits 10-Year High as Fires Rage Across West","publisher":"Newsweek","date":"2026-09-05","url":"https://www.newsweek.com/us-wildfires-hit-highest-acreage-burned-in-a-decade-12409322"},"tags":["fire","climate","suppression"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-timber-push","title":"Get the cut out","text":"A 2025 executive order seeks 25% more national forest timber. Analysts find willing mills sit near only about a third of priority fire landscapes, and fire-risk gains depend on how sales are designed.","horizon":"now","effects":[{"domain":"wood","delta":2},{"domain":"workforce","delta":-1},{"domain":"health","delta":-1}],"dilemma":{"prompt":"Your timber target just rose again. How do you design this year's program?","options":[{"label":"Chase volume near mills","text":"Concentrate sales where mills exist and logs pay, to hit the target and keep mills running.","effects":[{"domain":"wood","delta":1},{"domain":"communities","delta":1},{"domain":"fire","delta":-2}]},{"label":"Fuels-first sale design","text":"Design sales around fire risk and small trees, even if volume falls short and some draw no bids.","effects":[{"domain":"fire","delta":1},{"domain":"health","delta":1},{"domain":"wood","delta":-2}]},{"label":"Stewardship bundles","text":"Bundle timber with restoration in long stewardship contracts run with local partners.","effects":[{"domain":"partners","delta":1},{"domain":"workforce","delta":-1}]}]},"source":{"title":"Will Increased Timber Harvesting on Federal Lands Reduce Growing Wildfire Hazards?","publisher":"Resources for the Future","date":"2025-07-21","url":"https://www.rff.org/publications/reports/will-increased-timber-harvesting-on-federal-lands-reduce-growing-wildfire-hazards/"},"tags":["federal","wood","timber","fire"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-firesheds-fast-lane","title":"A fast lane for firesheds","text":"The Fix Our Forests Act passed the House and awaits a Senate vote. If enacted, it would speed fuels and restoration work in high-risk firesheds and let larger projects skip full environmental review.","horizon":"now","effects":[{"domain":"fire","delta":1},{"domain":"governance","delta":1},{"domain":"partners","delta":-2}],"dilemma":{"prompt":"New authority lets you skip parts of environmental review on big fireshed projects. How hard do you lean on it?","options":[{"label":"Use it to the max","text":"Apply every new exemption to move large projects in months, not years.","effects":[{"domain":"fire","delta":2},{"domain":"partners","delta":-2}]},{"label":"Speed with consent","text":"Use exemptions only where collaboratives, Tribes and counties already agree on the project.","effects":[{"domain":"partners","delta":1},{"domain":"workforce","delta":-1}]},{"label":"Pilot and monitor","text":"Test the authority on a few firesheds with independent monitoring before scaling up.","effects":[{"domain":"governance","delta":1},{"domain":"fire","delta":-1}]}]},"source":{"title":"\"Fire seasons are becoming fire years\": Will Congress act?","publisher":"Deseret News","date":"2026-11-13","url":"https://deseret.com/environment/2026/11/13/fire-seasons-are-becoming-fire-years-will-congress-act"},"tags":["federal","legislation","fire","nepa"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-policy-pendulum","title":"The pendulum swings back","text":"Federal priorities keep swinging with elections. In the 2030s, new majorities revisit recent changes: some budgets return, while reorganizations and rules reopen. Agencies face a second overhaul within a decade, and partners wonder what will stick.","horizon":"near","effects":[{"domain":"governance","delta":1},{"domain":"workforce","delta":-1},{"domain":"partners","delta":-1}],"dilemma":{"prompt":"A new majority offers to restore the old structure and budgets. What do you ask for?","options":[{"label":"Restore what was lost","text":"Rebuild regional offices, research stations and staffing toward pre-2025 levels.","effects":[{"domain":"workforce","delta":2},{"domain":"governance","delta":-1},{"domain":"partners","delta":-1}]},{"label":"Keep what works, fund it","text":"Keep state offices and streamlined authorities, but ask for stable multi-year funding.","effects":[{"domain":"governance","delta":1},{"domain":"workforce","delta":-1}]},{"label":"Lock it into law","text":"Spend political capital writing durable statutes so the next swing cannot easily undo them.","effects":[{"domain":"governance","delta":2},{"domain":"fire","delta":-1},{"domain":"workforce","delta":-1}]}]},"source":{"title":"Trying to Reason with A Midterm Election Earthquake","publisher":"farmdoc daily (University of Illinois)","date":"2026-11-05","url":"https://farmdocdaily.illinois.edu/2026/11/trying-to-reason-with-a-midterm-election-earthquake.html"},"tags":["federal","politics","budget","structure"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-insurance-retreat","title":"Uninsurable Main Street","text":"Insurers are pulling back from fire-prone towns: Utah's 2025 nonrenewal rate led the nation and pricier surplus-lines policies keep spreading. By the 2030s, whole WUI communities struggle to find coverage or mortgages.","horizon":"near","effects":[{"domain":"communities","delta":-2},{"domain":"governance","delta":-1}],"dilemma":{"prompt":"Insurers will return only if communities prove lower risk. Where do you put scarce mitigation dollars?","options":[{"label":"Harden homes, certify towns","text":"Fund home hardening and community certification so insurers can price risk down.","effects":[{"domain":"communities","delta":1},{"domain":"fire","delta":-1}]},{"label":"Treat the landscape","text":"Put the money into fuel breaks and landscape treatments around towns.","effects":[{"domain":"fire","delta":1},{"domain":"health","delta":-1}]},{"label":"Limit risky building","text":"Back state limits on new construction in the highest-risk zones.","effects":[{"domain":"fire","delta":1},{"domain":"governance","delta":1},{"domain":"communities","delta":-2}]}]},"source":{"title":"Advocates urge regulation of surplus line insurance as traditional coverage gets harder to keep","publisher":"KUNC / Mountain West News Bureau","date":"2026-09-24","url":"https://www.kunc.org/2026-09-24/surplus-lines-homeowners-insurance-utah-wildfire-climate-change"},"tags":["communities","insurance","wui"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-mass-timber-surge","title":"Wood goes vertical","text":"Mass timber has grown about 20% a year since 2015, with more than 2,500 projects built or underway by the end of 2025. By the 2030s, builders want steady supplies of the small and mid-size logs restoration produces.","horizon":"near","effects":[{"domain":"wood","delta":2},{"domain":"climate","delta":1},{"domain":"workforce","delta":-1}],"dilemma":{"prompt":"A mass-timber plant will locate in your state if public forests guarantee 20 years of log supply. Do you commit?","options":[{"label":"Guarantee the supply","text":"Sign long-term supply agreements from public forests to land the plant and its jobs.","effects":[{"domain":"wood","delta":1},{"domain":"communities","delta":1},{"domain":"health","delta":-2}]},{"label":"Restoration wood only","text":"Offer only fuels and restoration material; the plant may build smaller or go elsewhere.","effects":[{"domain":"fire","delta":1},{"domain":"health","delta":1},{"domain":"wood","delta":-2}]},{"label":"Let private lands supply","text":"Leave supply to private and family forests, with state incentives for certified wood.","effects":[{"domain":"partners","delta":1},{"domain":"governance","delta":-1}]}]},"source":{"title":"2025 Was a 'Pivotal' Year for Mass Timber Construction","publisher":"IWF Atlanta","date":"2026-02-11","url":"https://www.iwfatlanta.com/industry-trends/2025-was-a-pivotal-year-for-mass-timber-construction"},"tags":["wood","markets","mass-timber"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-carbon-boom","title":"Carbon money comes knocking","text":"California extended its carbon market to 2045 and raised the offset limit, requiring at least half from in-state projects. By the 2030s, carbon buyers court every forest owner, public and private, with long contracts.","horizon":"near","effects":[{"domain":"climate","delta":2},{"domain":"partners","delta":1},{"domain":"wood","delta":-2}],"dilemma":{"prompt":"Carbon buyers offer long-term payments to defer harvest on state and partner forests. Do you sign?","options":[{"label":"Sign the long contracts","text":"Enroll forests in decades-long carbon contracts that pay well but lock in deferred harvest.","effects":[{"domain":"climate","delta":2},{"domain":"wood","delta":-2}]},{"label":"Credit active care only","text":"Sell credits only from fuels reduction, reforestation and fire-resilient stands.","effects":[{"domain":"climate","delta":1},{"domain":"fire","delta":1},{"domain":"governance","delta":-2}]},{"label":"Keep forests flexible","text":"Decline long contracts to keep options open for timber, fuels work and future climate shifts.","effects":[{"domain":"wood","delta":1},{"domain":"climate","delta":-1}]}]},"source":{"title":"California extends cap-and-trade to 2045, renames program cap-and-invest","publisher":"International Carbon Action Partnership (ICAP)","date":"2025-09-29","url":"https://icapcarbonaction.com/en/news/california-extends-cap-and-trade-2045-renames-program-cap-and-invest"},"tags":["climate","carbon","markets","states"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-river-runs-short","title":"The river runs short","text":"Western water keeps tightening: in 2026 Lake Powell and Lake Mead held their least combined water since 1963 after record-low snowpack, forcing Lower Basin cuts. In the 2030s, cities look upstream to forests.","horizon":"near","effects":[{"domain":"water","delta":-2},{"domain":"communities","delta":-1}],"dilemma":{"prompt":"Downstream cities offer to fund thinning in their source watersheds, if those forests get top priority. Do you accept?","options":[{"label":"Follow the water money","text":"Prioritize utility-funded watersheds; other high-risk forests wait their turn.","effects":[{"domain":"water","delta":1},{"domain":"fire","delta":-1}]},{"label":"Pool it, treat by risk","text":"Take the money into a shared fund and treat wherever fire risk is highest.","effects":[{"domain":"fire","delta":1},{"domain":"partners","delta":-1}]},{"label":"Manage for snow, flow","text":"Thin stands and restore meadows to hold snow and boost late-season flows, as a monitored pilot.","effects":[{"domain":"water","delta":1},{"domain":"workforce","delta":-1}]}]},"source":{"title":"Interior Department Finalizes Plans for 2027-2028 Colorado River Operations","publisher":"U.S. Department of the Interior","date":"2026-08-21","url":"https://www.doi.gov/pressreleases/interior-department-finalizes-plans-2027-2028-colorado-river-operations"},"tags":["water","drought","west","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-fire-years","title":"Fire years, not fire seasons","text":"A UN assessment projects extreme wildfires rising about 30% by 2050. By the 2040s, U.S. fire activity spans most of the year, and staffing built around summer seasonal crews no longer fits.","horizon":"far","effects":[{"domain":"fire","delta":-2},{"domain":"workforce","delta":-1}],"dilemma":{"prompt":"Fire never really stops now. How do you staff for a year-round threat?","options":[{"label":"Year-round federal force","text":"Convert seasonal crews into a permanent fire service that fights fire and does fuels work all year.","effects":[{"domain":"fire","delta":1},{"domain":"workforce","delta":1},{"domain":"governance","delta":-2}]},{"label":"Community fire networks","text":"Train and fund local, volunteer, Tribal and private crews to share response and burning.","effects":[{"domain":"partners","delta":1},{"domain":"workforce","delta":-1}]},{"label":"Let remote fires work","text":"Manage remote fires for ecological benefit and defend only communities and critical infrastructure.","effects":[{"domain":"fire","delta":1},{"domain":"health","delta":1},{"domain":"recreation","delta":-2}]}]},"source":{"title":"UN warns that number of extreme wildfires will increase 30% by 2050, 50% by end of century","publisher":"KTNV / Scripps News (on UNEP report \"Spreading like Wildfire\")","date":"2022-02-23","url":"https://www.ktnv.com/news/national/un-warns-that-number-of-extreme-wildfires-will-increase-30-by-2050-50-by-end-of-century"},"tags":["fire","climate","workforce","research"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-pathogen-arrives","title":"The next chestnut blight","text":"The nursery trade keeps moving tree pathogens; sudden oak death was recently found for the first time in a Minnesota nursery. By the 2040s, an incurable pathogen establishes across a major U.S. forest type.","horizon":"far","effects":[{"domain":"health","delta":-2},{"domain":"wood","delta":-1}],"dilemma":{"prompt":"A deadly pathogen is racing through a keystone tree species. What is your strategy?","options":[{"label":"Contain at all costs","text":"Quarantine, cut buffer zones and restrict nursery and firewood movement across state lines.","effects":[{"domain":"health","delta":2},{"domain":"wood","delta":-2}]},{"label":"Breed resistant trees","text":"Invest in resistant and gene-edited trees with Tribes and universities, accepting public debate.","effects":[{"domain":"health","delta":1},{"domain":"partners","delta":-1}]},{"label":"Salvage and diversify","text":"Salvage dying stands fast and replant mixed species suited to the future climate.","effects":[{"domain":"wood","delta":1},{"domain":"climate","delta":1},{"domain":"health","delta":-2}]}]},"source":{"title":"Biosurveillance project flags first sudden oak death detection in Minnesota","publisher":"Minnesota Invasive Terrestrial Plants and Pests Center, University of Minnesota","date":"2026-01-15","url":"https://mitppc.umn.edu/news/biosurveillance-project-flags-first-sudden-oak-death-detection-minnesota"},"tags":["health","invasives","pathogen","research"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-algorithmic-forest","title":"Algorithms on the fireline","text":"The first operational FireSat satellites launched in 2026, aiming for hourly global coverage by 2029. By the 2040s, AI spots nearly every ignition within minutes and recommends where to thin, burn and dispatch.","horizon":"far","effects":[{"domain":"fire","delta":1},{"domain":"workforce","delta":1},{"domain":"governance","delta":-1}],"dilemma":{"prompt":"AI can now triage initial attack and rank treatments faster than any team. How much decision power do you give it?","options":[{"label":"Let the model dispatch","text":"Automate initial attack and treatment ranking; people audit the decisions afterward.","effects":[{"domain":"fire","delta":2},{"domain":"partners","delta":-1},{"domain":"workforce","delta":-1}]},{"label":"Humans make the call","text":"Use AI as an advisor; trained people make and explain every decision.","effects":[{"domain":"workforce","delta":1},{"domain":"governance","delta":-1}]},{"label":"Open the data commons","text":"Share models and data openly with Tribes, states, landowners and insurers.","effects":[{"domain":"partners","delta":1},{"domain":"communities","delta":1},{"domain":"governance","delta":-2}]}]},"source":{"title":"Muon Space Deploys First Three Operational FireSat Satellites for Earth Fire Alliance","publisher":"Muon Space","date":"2026-07-07","url":"https://www.muonspace.com/muon-space-deploys-first-three-operational-firesat-satellites-for-earth-fire-alliance/"},"tags":["technology","ai","fire","workforce"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-tribal-co-management","title":"Co-management goes mainstream","text":"Co-stewardship keeps spreading across administrations, like the Cow Creek Umpqua Tribe's 155,000-acre agreement on two Oregon national forests. By the 2040s, Tribes co-manage large areas of national forest, with cultural fire built in.","horizon":"far","effects":[{"domain":"partners","delta":2},{"domain":"fire","delta":1}],"dilemma":{"prompt":"Tribal nations propose taking the lead in managing several national forest units. How do you respond?","options":[{"label":"Transfer lead authority","text":"Support Tribes as lead managers, with federal funding and treaty-based standards.","effects":[{"domain":"partners","delta":2},{"domain":"governance","delta":-1},{"domain":"workforce","delta":-1}]},{"label":"Joint boards, shared budgets","text":"Create co-management boards where federal and Tribal leaders decide together.","effects":[{"domain":"partners","delta":1},{"domain":"fire","delta":1},{"domain":"workforce","delta":-2}]},{"label":"Grow agreements gradually","text":"Keep the federal lead but widen co-stewardship agreements unit by unit.","effects":[{"domain":"partners","delta":1},{"domain":"fire","delta":-1}]}]},"source":{"title":"Cow Creek Umpqua signs 155,000-acre forest co-stewardship agreement with U.S. Forest Service","publisher":"Tribal Business News","date":"2026-02-21","url":"https://tribalbusinessnews.com/sections/energy/15500-cow-creek-umpqua-signs-155-000-acre-forest-co-stewardship-agreement-with-u-s-forest-service"},"tags":["tribal","partners","co-stewardship","fire"],"status":"active","reviewed":"2026-11-14"},{"id":"drv-hand-it-to-states","title":"Hand the keys to the states","text":"Proposals to sell or transfer federal lands keep resurfacing; a 2025 Senate plan was dropped after bipartisan pushback. By the 2040s, Congress lets willing states take over management of some national forests.","horizon":"far","effects":[{"domain":"governance","delta":-2},{"domain":"partners","delta":1},{"domain":"recreation","delta":-1}],"dilemma":{"prompt":"Congress offers your state management of the national forests within its borders. Do you take it?","options":[{"label":"Accept, with federal funding","text":"Take over management only with guaranteed federal funding and current public access.","effects":[{"domain":"partners","delta":1},{"domain":"workforce","delta":-1}]},{"label":"Decline, stay a partner","text":"Stay a partner, not the owner; keep national rules and federal funding.","effects":[{"domain":"governance","delta":1},{"domain":"partners","delta":-1}]},{"label":"Accept, allow some sales","text":"Take over and allow limited land sales for housing and state revenue.","effects":[{"domain":"communities","delta":1},{"domain":"governance","delta":1},{"domain":"recreation","delta":-2}]}]},"source":{"title":"Sen. Mike Lee removes public lands provision from Trump's \"big, beautiful bill\"","publisher":"CBS News (Associated Press)","date":"2025-06-30","url":"https://www.cbsnews.com/news/sen-mike-lee-removes-public-lands-provision-from-trumps-big-beautiful-bill"},"tags":["federal","states","public-lands","devolution"],"status":"active","reviewed":"2026-11-14"}],"scenarios":[{"id":"scn-todays-trajectory","name":"Today's Trajectory","summary":"Starts from conditions in late 2026: a decade-high fire year, a Forest Service about one-sixth smaller after 2025 departures, a court-paused reorganization, a new Interior fire service, stopgap budgets, rising timber targets, Colorado River shortages and a newly elected Congress. Drivers extend current trends without assuming which political direction wins.","start":{"fire":3,"health":4,"water":4,"climate":4,"wood":5,"communities":4,"recreation":4,"workforce":3,"governance":4,"partners":5},"drivers":{"now":["drv-one-fire-service","drv-regions-to-states","drv-lean-years","drv-record-fire-year"],"near":["drv-policy-pendulum","drv-insurance-retreat","drv-river-runs-short","drv-mass-timber-surge"],"far":["drv-fire-years","drv-pathogen-arrives","drv-algorithmic-forest","drv-tribal-co-management"]},"tags":["baseline","evidence-based","realistic"],"status":"active","reviewed":"2026-11-14"},{"id":"scn-lean-federal","name":"Lean Federal Era","summary":"Washington keeps shrinking its footprint: leaner budgets, consolidated fire, fewer staff and faster approvals. Supporters see efficiency, more timber and local control; critics see lost capacity, science and public services. Markets, states and private owners fill gaps unevenly. Can partners do more with less federal help?","start":{"fire":4,"health":4,"water":4,"climate":3,"wood":7,"communities":5,"recreation":4,"workforce":3,"governance":4,"partners":5},"drivers":{"now":["drv-lean-years","drv-one-fire-service" ood","community"],"status":"active","reviewed":"2026-11-14"},{"id":"str-river-trail-stewards","title":"River & trail stewardship partners","text":"Outfitters, user groups, and volunteers adopt trails and river reaches, fixing erosion and reporting problems in exchange for access.","cost":3,"effects":[{"domain":"recreation","delta":1},{"domain":"water","delta":1}],"kind":"no-regret","tags":["recreation","water","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-outdoor-access","title":"Outdoor access & equity","text":"Shuttles, accessible trails, multilingual programs, and school partnerships bring new and underserved visitors to public lands.","cost":2,"effects":[{"domain":"recreation","delta":1}],"kind":"no-regret","tags":["recreation","community","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-beaver-meadows","title":"Beaver & meadow restoration","text":"Low-tech, process-based restoration (beaver dam analogs, wet meadows, riparian buffers) stores water, cools streams, and slows fire.","cost":3,"effects":[{"domain":"water","delta":1}],"delayed":[{"domain":"water","delta":1}],"kind":"no-regret","tags":["water","health"],"status":"active","reviewed":"2026-11-14"},{"id":"str-burn-boss-reform","title":"Burn-boss pipeline & liability reform","text":"Training exchanges, state liability standards, and a burn claims fund put more good fire on the ground, at the cost of more smoke days.","cost":3,"effects":[{"domain":"fire","delta":2},{"domain":"communities","delta":-1}],"kind":"trade-off","tags":["fire","workforce","state","policy"],"status":"active","reviewed":"2026-11-14"},{"id":"str-watershed-fund","title":"Utility watershed investment fund","text":"Water utilities add a ratepayer charge to co-fund thinning, burning, and restoration in the source watersheds they depend on.","cost":3,"effects":[{"domain":"water","delta":2},{"domain":"communities","delta":-1}],"kind":"trade-off","tags":["water","partners","finance"],"status":"active","reviewed":"2026-11-14"},{"id":"str-small-wood-markets","title":"Small-wood & biomass markets","text":"Incentives for biochar, pellets, and combined heat and power make thinning small trees pay, though burning biomass adds emissions.","cost":4,"effects":[{"domain":"wood","delta":2},{"domain":"fire","delta":1},{"domain":"climate","delta":-1}],"kind":"trade-off","tags":["wood","fire","climate"],"status":"active","reviewed":"2026-11-14"},{"id":"str-durable-planning","title":"Litigation-resilient planning","text":"Invest in strong analysis, early collaboration, and objection resolution so landscape projects hold up in court, at a real cost in staff time.","cost":2,"effects":[{"domain":"governance","delta":2},{"domain":"workforce","delta":-1}],"kind":"trade-off","tags":["policy","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-rec-fee-reinvestment","title":"Recreation fee reinvestment","text":"Modernize trails and campgrounds, keep fee revenue local, and market gateway towns, bringing more visitors and more wear on fragile sites.","cost":2,"effects":[{"domain":"recreation","delta":2},{"domain":"health","delta":-1}],"kind":"trade-off","tags":["recreation","community"],"status":"active","reviewed":"2026-11-14"},{"id":"str-family-forest-carbon","title":"Family forest carbon program","text":"Enroll small landowners in high-integrity carbon programs that pay for deferred harvest and better management, trimming near-term log supply.","cost":2,"effects":[{"domain":"climate","delta":2},{"domain":"wood","delta":-1}],"kind":"trade-off","tags":["climate","finance","private","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-fire-workforce","title":"Year-round fire workforce","text":"Permanent pay, year-round crews, housing, and mental-health support keep experienced firefighters, but compete for scarce budget dollars.","cost":4,"effects":[{"domain":"workforce","delta":2},{"domain":"fire","delta":1},{"domain":"governance","delta":-1}],"kind":"trade-off","tags":["workforce","fire","federal"],"status":"active","reviewed":"2026-11-14"},{"id":"str-timber-acceleration","title":"Accelerated timber output","text":"Raise harvest targets and streamline approvals to boost volume quickly, strengthening mills and county receipts but straining habitat and trail access.","cost":3,"effects":[{"domain":"wood","delta":3},{"domain":"health","delta":-1},{"domain":"recreation","delta":-1}],"kind":"trade-off","tags":["wood","federal","policy"],"status":"active","reviewed":"2026-11-14"},{"id":"str-old-forest-safeguards","title":"Mature & old-growth safeguards","text":"Durable protection for old and mature stands and roadless areas, paired with active stewardship around them, reducing some timber supply.","cost":4,"effects":[{"domain":"climate","delta":2},{"domain":"health","delta":1},{"domain":"wood","delta":-1}],"kind":"trade-off","tags":["climate","health","policy","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-pest-rapid-response","title":"Pest early detection & rapid response","text":"Trap networks, detector dogs, and fast strike teams catch invasive insects and diseases early; quarantines restrict log and firewood movement.","cost":2,"effects":[{"domain":"health","delta":2},{"domain":"wood","delta":-1}],"kind":"trade-off","tags":["health","science","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-post-fire-teams","title":"Post-fire recovery strike teams","text":"Interagency teams stabilize burned slopes, warn downstream towns of debris flows, and replant with utility and Tribal partners.","cost":2,"effects":[{"domain":"water","delta":1},{"domain":"health","delta":1},{"domain":"workforce","delta":-1}],"kind":"trade-off","tags":["water","health","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-lean-operations","title":"Lean operations consolidation","text":"Close or merge offices and shift functions to regional hubs, saving money fast but thinning local staff and visitor services.","cost":2,"effects":[{"domain":"governance","delta":2},{"domain":"workforce","delta":-1},{"domain":"recreation","delta":-1}],"kind":"trade-off","tags":["federal","policy"],"status":"active","reviewed":"2026-11-14"},{"id":"str-reforestation-surge","title":"Nursery & reforestation surge","text":"Expand seed collection, nurseries, and planting crews to close the post-fire reforestation backlog with climate-informed stock.","cost":4,"effects":[{"domain":"health","delta":1}],"delayed":[{"domain":"health","delta":1},{"domain":"climate","delta":1}],"kind":"hedge","tags":["health","climate","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-remote-sensing","title":"AI & remote-sensing early warning","text":"Satellites, cameras, and drones with machine-learning detection flag new ignitions, beetle kill, and drought stress early, and share the data openly.","cost":3,"effects":[{"domain":"fire","delta":1}],"delayed":[{"domain":"health","delta":1}],"kind":"hedge","tags":["tech","science","fire"],"status":"active","reviewed":"2026-11-14"},{"id":"str-seed-banking","title":"Seed banks & assisted migration","text":"Bank genetically diverse seed, test climate-adapted sources in trial plantings, and update seed-zone rules for a warmer future.","cost":3,"effects":[{"domain":"health","delta":1}],"delayed":[{"domain":"climate","delta":1}],"kind":"hedge","tags":["science","health","climate"],"status":"active","reviewed":"2026-11-14"},{"id":"str-science-practice","title":"Science-to-practice partnerships","text":"Research stations, universities, and extension embed scientists with managers to co-design treatments and monitor what works.","cost":3,"effects":[{"domain":"workforce","delta":1}],"delayed":[{"domain":"health","delta":1}],"kind":"hedge","tags":["science","partners","workforce"],"status":"active","reviewed":"2026-11-14"},{"id":"str-working-forest-finance","title":"Working-forest conservation finance","text":"Blend Forest Legacy, state, philanthropic, and private capital into easements that keep family and industrial forests working and intact.","cost":5,"effects":[{"domain":"partners","delta":1},{"domain":"wood","delta":1}],"delayed":[{"domain":"climate","delta":1}],"kind":"hedge","tags":["finance","partners","wood","private"],"status":"active","reviewed":"2026-11-14"},{"id":"str-climate-ready-plans","title":"Climate-ready forest plans","text":"Revise land management plans around climate scenarios, drought refugia, and carbon, accepting slower project approvals while plans change.","cost":4,"effects":[{"domain":"climate","delta":2},{"domain":"health","delta":1},{"domain":"governance","delta":-1}],"kind":"hedge","tags":["climate","policy","science"],"status":"active","reviewed":"2026-11-14"},{"id":"str-mass-timber-standard","title":"Mass timber procurement standard","text":"Public buildings specify mass timber made from restoration wood, giving mills a steady buyer and storing carbon in schools and housing.","cost":6,"effects":[{"domain":"wood","delta":2},{"domain":"climate","delta":1}],"delayed":[{"domain":"communities","delta":1}],"kind":"big-bet","tags":["wood","climate","policy"],"status":"active","reviewed":"2026-11-14"},{"id":"str-stable-budgets","title":"Stable fire & land budgets","text":"A broad coalition wins predictable multi-year funding so suppression costs stop draining fuels, research, and recreation programs.","cost":7,"effects":[{"domain":"governance","delta":2}],"delayed":[{"domain":"workforce","delta":1},{"domain":"health","delta":1}],"kind":"big-bet","tags":["policy","federal","partners"],"status":"active","reviewed":"2026-11-14"},{"id":"str-wui-compact","title":"WUI land-use & insurance compact","text":"State codes, county zoning, and insurer discounts reward fire-adapted development: a hard political lift with lasting payoff.","cost":6,"effects":[{"domain":"communities","delta":2},{"domain":"governance","delta":-1}],"delayed":[{"domain":"fire","delta":1},{"domain":"communities","delta":1}],"kind":"big-bet","tags":["community","policy","state"],"status":"active","reviewed":"2026-11-14"},{"id":"str-unified-fire-service","title":"Unified federal fire service","text":"Consolidate federal wildland fire into one agency with common standards and careers: promising efficiency, risking disruption to shared crews and land-management ties.","cost":7,"effects":[{"domain":"fire","delta":2},{"domain":"workforce","delta":1},{"domain":"partners","delta":-1},{"domain":"governance","delta":-1}],"delayed":[{"domain":"fire","delta":1},{"domain":"workforce","delta":1}],"kind":"big-bet","tags":["fire","federal","policy","workforce"],"status":"active","reviewed":"2026-11-14"},{"id":"str-resilience-bond","title":"Forest resilience bond","text":"Private investors front the cost of restoration; utilities, agencies, and insurers repay them as avoided-fire benefits arrive.","cost":6,"effects":[{"domain":"fire","delta":1},{"domain":"water","delta":1}],"delayed":[{"domain":"health","delta":1},{"domain":"partners","delta":1}],"kind":"big-bet","tags":["finance","partners","water","fire"],"status":"active","reviewed":"2026-11-14"}],"cascades":[{"id":"cas-fire-deficit","when":{"domain":"fire","lte":3},"effects":[{"domain":"water","delta":-1},{"domain":"communities","delta":-1}],"text":"A growing fire deficit: big fires keep burning through source watersheds and into towns."},{"id":"cas-heat-stress","when":{"domain":"climate","lte":3},"effects":[{"domain":"health","delta":-1}],"text":"Heat and drought outrun adaptation: drought stress and beetles keep killing trees."},{"id":"cas-health-crisis","when":{"domain":"health","lte":2},"effects":[{"domain":"fire","delta":-1},{"domain":"climate","delta":-1}],"text":"Dead and dying stands become fuel and turn from carbon sink to source."},{"id":"cas-water-crisis","when":{"domain":"water","lte":2},"effects":[{"domain":"communities","delta":-1},{"domain":"health","delta":-1}],"text":"Ash-choked reservoirs and drying streams hit towns and riparian forests."},{"id":"cas-wood-crisis","when":{"domain":"wood","lte":2},"effects":[{"domain":"workforce","delta":-1},{"domain":"communities","delta":-1}],"text":"The last mill closes; loggers and the restoration workforce leave with it."},{"id":"cas-communities-crisis","when":{"domain":"communities","lte":2},"effects":[{"domain":"governance","delta":-1},{"domain":"recreation","delta":-1}],"text":"Rural distress and insurance retreat erode the tax base and the public's patience."},{"id":"cas-workforce-crisis","when":{"domain":"workforce","lte":2},"effects":[{"domain":"fire","delta":-1},{"domain":"partners","delta":-1}],"text":"No one left to staff crews or keep agreements alive."},{"id":"cas-partners-crisis","when":{"domain":"partners","lte":2},"effects":[{"domain":"governance","delta":-1},{"domain":"fire","delta":-1}],"text":"Trust collapses into lawsuits and go-it-alone projects."},{"id":"cas-partners-thriving","when":{"domain":"partners","gte":8},"effects":[{"domain":"governance","delta":1}],"text":"A united coalition makes the budget case together and wins."},{"id":"cas-wood-boom","when":{"domain":"wood","gte":8},"effects":[{"domain":"communities","delta":1},{"domain":"climate","delta":-1}],"text":"A timber boom pays wages and county bills, and pulls harvest toward older stands."},{"id":"cas-recreation-boom","when":{"domain":"recreation","gte":8},"effects":[{"domain":"partners","delta":1},{"domain":"health","delta":-1}],"text":"Record crowds create new champions for the forest, and new wear on fragile places."},{"id":"cas-wui-sprawl","when":{"domain":"communities","gte":8},"effects":[{"domain":"fire","delta":-1}],"text":"Thriving towns sprawl deeper into fire country: more homes and ignitions to defend."}],"rules":{"handSize":3,"capacityBase":5,"capacityBaseByPlayers":{"3":8,"4":7,"5":5,"6":4,"7":3},"capacityModifiers":{"Crisis":-2,"Strained":-1,"Stable":0,"Thriving":1,"Transformed":1},"capacityMin":1,"councilSeconds":300,"headlineSeconds":120,"collapseCrisisCount":3,"outcome":{"resilient":6,"resilientFloor":5,"holding":4.5,"holdingFloor":3},"outcomeDeep":{"resilientFloor":6},"headlineInfluence":2,"marketSize":5,"marketRefresh":"fresh","farDelayed":"legacy","cascadeMode":"simultaneous","signalRounds":{"standard":1,"deep":2}},"prompts":{"debrief":["Which Signals in this game are you already seeing in your own work today? Where?","Which strategy would have been worth funding in every era we played? What makes it a no-regret move for us now?","Where did pooling Capacity across roles change the outcome, and where did we leave Capacity on the table?","Which Dilemma vote was hardest? What would you need to know to make that call with confidence in real life?","When Workforce or Policy & Funding fell, how did it constrain everyone? Where are we already feeling that?","Whose mandate conflicted with yours? What would a deal that serves both actually look like?","Which cascade surprised you? What early warning would let us see it coming in time?","Which partner who was not at this table would have changed the game most?","If you could rewrite one Headline of the Era as the future you want, what would it say, and what makes it plausible?","Which of the Signals to Watch should we track as an organization, and who will own watching it?"],"monday":["Name one Signal from today you will share with your team this week, and the question you will ask them about it.","Name one no-regret strategy you can start or strengthen within 90 days with the authority and budget you have now.","Name one partner you will call this month to explore pooling capacity, and what you will offer first.","Name one assumption about the next five years that today's game challenged. How will you test it?","Put a date on the calendar to revisit today's Insight Log with your leadership team."]},"roleSets":{"3":["role-state-forester","role-forest-supervisor","role-tribal-nr-director"],"4":["role-state-forester","role-forest-supervisor","role-tribal-nr-director","role-county-commissioner"], ## What changed from the 2019 edition

- **You play as yourself.** Players take leader and partner roles (State Forester, Forest Supervisor, Tribal Natural Resources Director, County Commissioner, and others) instead of "jobs from the future". The jobs live on as the future titles revealed at the end.
- **Conditions, not cubes.** Each of ten domains has a condition from 0 (Crisis) to 10 (Transformed), so a signal can make things better or worse. The 2019 cubes measured only the rate of change.
- **New domains for today's forestry.** Fire & Fuels, Policy & Funding, Workforce & Capacity and Partnerships & Co-Stewardship replace Transportation, Energy, Medicine & Wellness and Food & Agriculture, which fold into the remaining domains.
- **Three eras: Now, Near, Far.** Each era draws signals weighted to its horizon, so the game moves from today's facts to weak signals and wildcards.
- **Leaders decide.** Each era brings an Era Driver with a dilemma for the table, and a Leadership Council where players pool scarce Capacity into strategies. That Capacity shrinks when Workforce or Policy & Funding is strained.
- **Shared stakes.** Each player has a secret mandate, but if the forest system unravels nobody wins. In balance testing, cooperative tables reached a resilient future about nine times as often as selfish ones.
- **A record you can use.** Headline of an Era stays, and now comes with a "So what for us now?" line. The debrief collects the headlines, decisions and signals to watch into a report you can take back to work.
- **A fresh deck.** 98 signals from 2025\u20132026 sources replace the 2016\u20132019 deck. 11 of the strongest 2019 cards were refreshed with current evidence.

## Keeping this tool current

- **Every six months: horizon scan.** Add 10\u201320 new signals in the Content Library and retire ones that have played out. Each card needs a real source you have read, written in your own words.
- **Use the "Review due" filter.** It lists cards not reviewed in 18 months. Re-check each source, update the date, then save or retire the card.
- **After big events, update the drivers.** Examples are a new law, a reorganization or a record fire year. Era Drivers and their dilemmas should reflect choices leaders face now, and scenarios set the starting conditions.
- **Keep it balanced.** Aim for an even mix of good and bad news in each domain, and for trade-offs on about half the cards. If games keep ending the same way, adjust scenario starting levels before rewriting cards.
- **Share your edits.** Edits stay on your device until you choose Publish to everyone, where that's available, or export the JSON and share the file. Phones compute secret mandates from the same content, so everyone at the table must use the same edition. The edition code appears on the host and on every phone.
- **Stay candid and even-handed.** Describe policy changes neutrally with sources, show both opportunities and risks, and never mock people or institutions.
